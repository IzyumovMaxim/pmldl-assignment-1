stages:
  prepare:
    cmd: python -m code.datasets.prepare --config params.yaml
    deps:
      - code/datasets/prepare.py
      - code/common.py
      - data/raw/steam_games.csv
    params:
      - data
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
  train:
    cmd: python -m code.models.train --config params.yaml
    deps:
      - code/models/train.py
      - code/common.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - model
      - mlflow
      - data.min_reviews
      - data.min_positive_ratio
    outs:
      - models/steam_success_model.joblib
    metrics:
      - models/metrics.json:
          cache: false
